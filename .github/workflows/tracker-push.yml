name: 'Tracker: commits to Weeek'

on:
  push:

permissions:
  contents: read

concurrency:
  group: tracker-push-${{ github.ref }}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Send comments to Weeek
        env:
          WEEEK_API_TOKEN: ${{ secrets.WEEEK_API_TOKEN }}
          # for author profile link resolution: anonymous limit is 60 requests/hour on the shared
          # runner IP, 5000 with a token; the variable name is read by the provider resolver
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: bash .github/scripts/tracker-notify.sh push
