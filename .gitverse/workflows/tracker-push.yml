name: 'Tracker: коммиты в Weeek'

on:
  push:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Собрать коммиты пуша
        env:
          BEFORE: ${{ gitverse.event.before }}
          AFTER: ${{ gitverse.event.after }}
          HEAD_SHA: ${{ gitverse.sha }}
        run: |
          zero=0000000000000000000000000000000000000000
          after="${AFTER:-$HEAD_SHA}"
          range="-1"
          if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "$zero" ] && [ -n "$after" ]; then
            range="$BEFORE..$after"
          fi
          echo "range=$range"
          git log --format='%H%x09%s' "$range" > /tmp/commits.tsv
          wc -l < /tmp/commits.tsv

      - name: Отправить комментарии в Weeek
        env:
          WEEEK_API_TOKEN: ${{ secrets.WEEEK_API_TOKEN }}
          GITVERSE_REPOSITORY: ${{ gitverse.repository }}
          BRANCH: ${{ gitverse.head_ref || gitverse.ref_name }}
        run: bash .gitverse/scripts/tracker/notify.sh push < /tmp/commits.tsv
