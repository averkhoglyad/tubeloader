# Временный: снимает факты о контексте раннера. Удаляется после прогона.
name: Tracker probe

on:
  workflow_dispatch:
  push:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Контекст
        run: |
          echo "event_name=${{ gitverse.event_name }}"
          echo "ref=${{ gitverse.ref }}"
          echo "ref_name=${{ gitverse.ref_name }}"
          echo "head_ref=${{ gitverse.head_ref }}"
          echo "sha=${{ gitverse.sha }}"
          echo "repository=${{ gitverse.repository }}"
          echo "workspace=${{ gitverse.workspace }}"
          echo "--- event ---"
          echo '${{ toJSON(gitverse.event) }}'

      - name: Контекст MR
        if: ${{ gitverse.event_name == 'pull_request' }}
        run: echo '${{ toJSON(gitverse.event.pull_request) }}'

      - name: Инструменты раннера
        run: |
          for t in bash curl git jq node python3; do
            printf '%s: ' "$t"
            command -v "$t" || echo missing
          done
          bash --version | head -1
