name: 'Tracker: слияние MR в Weeek'

on:
  pull_request:
    types: [closed]

jobs:
  notify:
    if: gitverse.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Отправить комментарий в Weeek
        env:
          WEEEK_API_TOKEN: ${{ secrets.WEEEK_API_TOKEN }}
          GITVERSE_REPOSITORY: ${{ gitverse.repository }}
          PR_NUMBER: ${{ gitverse.event.pull_request.number }}
          PR_TITLE: ${{ gitverse.event.pull_request.title }}
          PR_AUTHOR: ${{ gitverse.actor }}
          PR_HEAD_REF: ${{ gitverse.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ gitverse.event.pull_request.base.ref }}
          PR_MERGE_SHA: ${{ gitverse.event.pull_request.merge_commit_sha }}
        run: bash .gitverse/scripts/tracker/notify.sh pr
