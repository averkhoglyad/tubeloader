# Глобальные настройки клиента Weeek API (scripts/weeek/weeek.sh).
# Формат KEY=value, файл читается через source; путь переопределяется env WEEEK_CONF.

apiBase=https://api.weeek.net/public/v1

# id задачи в тексте: [N], где N — id задачи Weeek.
ticketPattern='\[[0-9]+\]'

commentsPage=100
apiMaxTime=30
