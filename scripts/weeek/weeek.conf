# Глобальные настройки клиента Weeek API (scripts/weeek/weeek.sh).
# Формат KEY=value, файл читается через source; путь переопределяется env WEEEK_CONF.

apiBase=https://api.weeek.net/public/v1

# id задачи в тексте: [N], где N — id задачи Weeek.
ticketPattern='\[[0-9]+\]'

commentsPage=100
apiMaxTime=30

# Пути веб-ссылок хоста; плейсхолдер __VALUE__ заменяется именем ветки или номером PR.
# Форма ${key:-...} задаёт значение хоста GitVerse по умолчанию: провайдерский конфиг,
# прочитанный раньше, оставляет своё значение.
# GitVerse: /content/__VALUE__ и /pulls/__VALUE__;  GitHub: /tree/__VALUE__ и /pull/__VALUE__.
branchPath="${branchPath:-/content/__VALUE__}"
prPath="${prPath:-/pulls/__VALUE__}"
