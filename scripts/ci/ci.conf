# Настройки CI-слоя (scripts/ci/commits.sh, scripts/ci/notify.sh): не зависят от CI-провайдера.
# Формат KEY=value, файл читается через source; путь переопределяется env CI_CONF.

# id задачи в тексте: [N], где N — id задачи Weeek.
ticketPattern='\[[0-9]+\]'

# Путь к скрипту домена (от корня репозитория). CI-оркестратор знает, какой домен подключён;
# провайдерский конфиг про домен не знает.
dispatcher=scripts/weeek/weeek.sh
