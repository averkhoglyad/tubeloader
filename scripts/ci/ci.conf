# CI layer settings (scripts/ci/commits.sh, scripts/ci/notify.sh): provider-independent.
# Format KEY=value, sourced; the path is overridden by the CI_CONF env var.

# Ticket id in text: [N], where N is the Weeek ticket id.
ticketPattern='\[[0-9]+\]'

# Path to the domain script (relative to the repo root). The CI orchestrator knows which
# domain is wired in; the provider config knows nothing about the domain.
dispatcher=scripts/weeek/weeek.sh
