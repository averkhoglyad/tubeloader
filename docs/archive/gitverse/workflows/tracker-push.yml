name: 'Tracker: коммиты в Weeek'

on:
  push:

permissions:
  contents: read

concurrency:
  group: tracker-push-${{ gitverse.ref }}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Отправить комментарии в Weeek
        env:
          WEEEK_API_TOKEN: ${{ secrets.WEEEK_API_TOKEN }}
          BEFORE: ${{ gitverse.event.before }}
          AFTER: ${{ gitverse.event.after }}
          BRANCH: ${{ gitverse.head_ref || gitverse.ref_name }}
        run: bash .gitverse/scripts/tracker-notify.sh push
